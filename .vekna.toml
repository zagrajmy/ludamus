[rituals]
modules = ["cabinet.rituals"]

# Only what differs from cabinet's defaults; everything else follows the tome,
# so a cabinet bump is not silently frozen out by a copied value.
[cabinet]
remote = "https-origin"
sign_commits = false
review_skill = ".claude/skills/thermo-nuclear-code-quality-review/SKILL.md"
coverage = "mise run diff-cover"

# CI checks the rituals fix, keyed by a prefix of the check name. `test`
# covers test-postgres/-unit/-e2e and the aggregator; `codecov/patch` is red
# on missing patch coverage. `tingle` is left out on purpose — it is
# continue-on-error and never turns the board red.
[cabinet.ci.jobs]
checks = {}
frontend-analysis = {}
test = {}
"codecov/patch" = { covering = true }

# NOTE: a pooled worktree is a bare checkout, so it has none of the gitignored
# secrets varlock requires. `.worktreeinclude` names them; the main checkout
# has them.
[circle]
prepare = '''
set -e
main=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")
while read -r path; do
  [ -e "$path" ] || [ ! -e "$main/$path" ] || cp -r "$main/$path" "$path"
done < "$main/.worktreeinclude"
'''
