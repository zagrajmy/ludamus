id: no-static-alerts
language: html
severity: error
files:
  - src/ludamus/templates/**/*.html
ignores:
  - src/ludamus/templates/components/flash-messages.html
  - src/ludamus/templates/design.html
rule:
  kind: attribute
  regex: '(?s)^class\s*=\s*["\x27](?:[^"\x27]*\s)?alert(?:-[a-z]+)?(?:\s|["\x27])'
message: |
  Static message banners are banned in page templates.
  Put status beside the relevant item, guidance beside its field, and
  upcoming plans on the dashboard with a title, time, and link.
  Use tessera_errors for form errors and Django messages for dismissible
  action feedback. Do not recreate colored banner boxes with utilities.
note: |
  Only the centralized flash-message renderer and design gallery may
  demonstrate the alert component. A role="alert" on an inline validation
  error is still allowed; this rule bans the banner styling, not semantics.
