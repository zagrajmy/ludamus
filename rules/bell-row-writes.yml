id: bell-row-writes
language: python
severity: error
files:
  - src/**/*.py
ignores:
  - src/ludamus/links/db/django/delivery.py
  - src/ludamus/links/db/django/migrations/**
rule:
  any:
    - pattern: Notification($$$)
    - pattern: $M.Notification($$$)
    - pattern: Notification.$MANAGER.$METHOD($$$)
    - pattern: $M.Notification.$MANAGER.$METHOD($$$)
    - pattern: $X.notifications.$METHOD($$$)
    - kind: aliased_import
      has:
        field: name
        regex: (^|\.)Notification$
constraints:
  METHOD:
    regex: ^a?(create|bulk_create|get_or_create|update_or_create)$
message: |
  A bell row is written in its reader's language, not the sender's.
  Compose inside `speaking_to(user_id)` and create it with `ring` from
  links/db/django/delivery.py.
