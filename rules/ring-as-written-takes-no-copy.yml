id: ring-as-written-takes-no-copy
language: python
severity: error
rule:
  any:
    - pattern: ring_as_written($$$)
    - pattern: $M.ring_as_written($$$)
  has:
    field: arguments
    has:
      kind: call
      stopBy: end
      has:
        field: function
        regex: (^|\.)(_|gettext|ngettext|pgettext|npgettext|gettext_lazy|ngettext_lazy|pgettext_lazy|npgettext_lazy)$
message: |
  `ring_as_written` sends its text to every reader as is, so translated
  copy would reach them all in the sender's language. Compose app copy
  inside `speaking_to(...)` and deliver it through `ring` / `_deliver`.
