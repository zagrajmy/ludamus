id: ring-as-written-call-sites
language: python
severity: error
files:
  - src/**/*.py
ignores:
  - src/ludamus/links/db/django/admin.py
  - src/ludamus/links/db/django/notifications.py
rule:
  any:
    - pattern: ring_as_written($$$)
    - pattern: $M.ring_as_written($$$)
message: |
  `ring_as_written` sends one text to every reader, in whatever language it
  was written. It is for a person's own words alone: organizer
  announcements (notifications.py) and staff notices (admin.py). Copy the
  app writes goes through `ring` / `_deliver` inside `speaking_to(...)`.
  A new call site of hand-written text must be added to this rule's
  ignores, in review.
