id: voice-call-sites
language: python
severity: error
files:
  - src/**/*.py
ignores:
  - src/ludamus/links/db/django/recipients.py
  - src/ludamus/links/db/django/delivery.py
  - src/ludamus/links/db/django/encounter_invites.py
rule:
  kind: identifier
  regex: ^Voice$
  not:
    any:
      - all:
          - inside:
              kind: import_from_statement
              stopBy: end
          - not:
              inside:
                kind: aliased_import
                stopBy: end
      - inside:
          kind: function_definition
          stopBy: end
          has:
            field: name
            regex: ^notify_anonymous_proposal_accepted$
message: |
  A Voice speaks whatever language it is handed, so mail composed under one
  is only as right as that language. It is for addresses with no account
  behind them, in the language resolved for them: encounter guests
  (`address_languages`) and anonymous proposers (stored at submission).
  Mail to an account goes through `speaking_to(user_id)`.
  A new use must be added to this rule, in review.
