id: mail-to-only-for-email-lifecycle
language: python
severity: error
files:
  - src/**/*.py
rule:
  pattern: speaking_to($$$, mail_to=$A)
  not:
    inside:
      kind: function_definition
      stopBy: end
      has:
        field: name
        regex: ^notify_email_(verification|change_requested|change_completed)$
message: |
  `mail_to` mails an address nobody proved, bypassing the account's
  proven one. Only the email-lifecycle notices need that: the address
  being proven, or the pre-change one. Everything else mails what
  `speaking_to(user_id)` resolves.
