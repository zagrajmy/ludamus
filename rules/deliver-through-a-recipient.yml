id: deliver-through-a-recipient
language: python
severity: error
files:
  - src/**/*.py
ignores:
  - src/ludamus/links/db/django/notifications.py
  - src/ludamus/links/db/django/encounter_invites.py
  - src/ludamus/links/db/django/migrations/**
rule:
  any:
    - pattern: Notification($$$)
    - pattern: Notification.objects.create($$$)
    - pattern: Notification.objects.bulk_create($$$)
    - pattern: EmailMessage($$$)
    - pattern: EmailMultiAlternatives($$$)
    - pattern: send_mail($$$)
    - pattern: send_mass_mail($$$)
message: |
  Notifications and mail are written in their reader's language, not the
  sender's. Compose and deliver them in links/db/django/notifications.py
  (or encounter_invites.py), inside `speaking_to(...)`, and hand the
  Recipient it yields to the delivery helper. Text a person wrote, sent
  as written, goes through `ring_as_written`.
