id: deliver-through-a-recipient
language: python
severity: error
files:
  - src/**/*.py
ignores:
  - src/ludamus/links/db/django/delivery.py
  - src/ludamus/links/db/django/migrations/**
rule:
  any:
    - pattern: Notification($$$)
    - pattern: $M.Notification($$$)
    - pattern: Notification.$MANAGER.$METHOD($$$)
    - pattern: $M.Notification.$MANAGER.$METHOD($$$)
    - pattern: $X.notifications.$METHOD($$$)
    - pattern: from django.core.mail import $$$
    - pattern: from django.core import mail
    - pattern: from django.core import mail as $A
    - pattern: import django.core.mail
    - pattern: import django.core.mail as $A
    - kind: aliased_import
      has:
        field: name
        regex: (^|\.)Notification$
    - kind: identifier
      regex: ^_bell_row$
    - pattern: EmailMessage($$$)
    - pattern: $M.EmailMessage($$$)
    - pattern: EmailMultiAlternatives($$$)
    - pattern: $M.EmailMultiAlternatives($$$)
    - pattern: send_mail($$$)
    - pattern: $M.send_mail($$$)
    - pattern: send_mass_mail($$$)
    - pattern: $M.send_mass_mail($$$)
    - pattern: mail_admins($$$)
    - pattern: $M.mail_admins($$$)
    - pattern: $M.send_messages($$$)
constraints:
  METHOD:
    regex: ^(create|bulk_create|get_or_create|update_or_create)$
message: |
  Notifications and mail are written in their reader's language, not the
  sender's. Compose them inside `speaking_to(user_id)` (an account) or
  `with Voice(language, address=...)` (an address alone), and deliver
  with `ring` / `compose_mail` from links/db/django/delivery.py.
