id: inbox-reads-only
language: python
severity: error
files:
  - src/ludamus/links/db/django/notification_inbox.py
rule:
  any:
    - pattern: Notification($$$)
    - pattern: $Q.$METHOD($$$)
constraints:
  METHOD:
    regex: ^(create|bulk_create|get_or_create|update_or_create)$
message: |
  The inbox reads the bell and marks it read; rows are created in
  links/db/django/delivery.py, in their reader's language.
