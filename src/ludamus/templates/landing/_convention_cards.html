{% load static %}
<div class="grid grid-cols-2 max-[40rem]:grid-cols-1 gap-4 max-w-[38rem]">
    <a class="group/conv relative overflow-hidden rounded-2xl border border-border min-h-[8.5rem] flex items-end p-4 no-underline"
       href="https://kapitularz.zagrajmy.net/"
       target="_blank"
       rel="noopener">
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover/conv:scale-105"
             src="{% static 'placeholder-images/03.webp' %}"
             alt=""
             width="800"
             height="400"
             loading="lazy">
        <span class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-black/5"
              aria-hidden="true"></span>
        <span class="relative text-white font-bold text-[1.05rem] leading-tight">
            Kapitularz
            <span class="block mt-0.5 text-[0.8rem] font-medium text-white/75">kapitularz.zagrajmy.net</span>
        </span>
    </a>
    <a class="group/conv relative overflow-hidden rounded-2xl border border-border min-h-[8.5rem] flex items-end p-4 no-underline"
       href="https://bachanalia.zagrajmy.net/"
       target="_blank"
       rel="noopener">
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover/conv:scale-105"
             src="{% static 'placeholder-images/05.webp' %}"
             alt=""
             width="800"
             height="400"
             loading="lazy">
        <span class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-black/5"
              aria-hidden="true"></span>
        <span class="relative text-white font-bold text-[1.05rem] leading-tight">
            Bachanalia Fantastyczne
            <span class="block mt-0.5 text-[0.8rem] font-medium text-white/75">bachanalia.zagrajmy.net</span>
