{% load i18n %}
{% load static %}
<div class="grid grid-cols-3 max-[52rem]:grid-cols-1 gap-4 max-w-[58rem]">
    {% for convention in conventions %}
        <a class="group/conv relative overflow-hidden rounded-2xl border border-border min-h-[8.5rem] flex items-end p-4 no-underline"
           href="https://{{ convention.domain }}{% url 'web:chronology:event' slug=convention.event_slug %}"
           target="_blank"
           rel="noopener">
            <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover/conv:scale-105"
                 src="{% if convention.cover_image_url %}{{ convention.cover_image_url }}{% else %}{% static 'placeholder-images/03.webp' %}{% endif %}"
                 alt=""
                 width="800"
                 height="400"
                 loading="lazy">
            <span class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-black/5"
                  aria-hidden="true"></span>
            <span class="relative text-white font-bold text-[1.05rem] leading-tight">{{ convention.name }}</span>
        </a>
    {% endfor %}
</div>
