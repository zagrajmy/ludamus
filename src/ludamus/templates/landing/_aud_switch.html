{% load i18n %}
{% translate "Choose page view" as t_switch %}
<div class="ld d0 inline-flex gap-[0.2rem] bg-bg-tertiary border border-border rounded-full p-[0.22rem]"
     role="group"
     aria-label="{{ t_switch }}">
    <label for="aud-org"
           class="cursor-pointer select-none text-[0.86rem] font-semibold text-foreground-secondary px-[0.85rem] py-[0.32rem] rounded-full transition-colors hover:text-foreground group-has-[#aud-org:checked]/aud:bg-bg-secondary group-has-[#aud-org:checked]/aud:text-foreground group-has-[#aud-org:checked]/aud:shadow-sm group-has-[#aud-org:focus-visible]/aud:outline-2 group-has-[#aud-org:focus-visible]/aud:outline-primary group-has-[#aud-org:focus-visible]/aud:outline-offset-2">
        {% translate "For organizers" %}
    </label>
    <label for="aud-gracz"
           class="cursor-pointer select-none text-[0.86rem] font-semibold text-foreground-secondary px-[0.85rem] py-[0.32rem] rounded-full transition-colors hover:text-foreground group-has-[#aud-gracz:checked]/aud:bg-bg-secondary group-has-[#aud-gracz:checked]/aud:text-foreground group-has-[#aud-gracz:checked]/aud:shadow-sm group-has-[#aud-gracz:focus-visible]/aud:outline-2 group-has-[#aud-gracz:focus-visible]/aud:outline-primary group-has-[#aud-gracz:focus-visible]/aud:outline-offset-2">
        {% translate "For players" %}
    </label>
</div>
