{% load i18n vite_tags %}
{% vite_asset_once 'src/color-field.ts' %}
<div class="flex items-center gap-2" data-color-field>
    <input type="color"
           class="size-11 shrink-0 cursor-pointer rounded-lg border border-border bg-bg-secondary p-1 disabled:cursor-not-allowed disabled:opacity-50"
           aria-label="{{ label }} — {% translate 'Color picker' %}"
           {% if disabled or readonly %}disabled{% endif %}
           hidden>
    {% include "components/text-field.html" with class="h-11 placeholder:text-foreground-secondary" spellcheck="false" autocomplete="off" placeholder="#rrggbb" %}
</div>
