{% load i18n %}
{% if announcements %}
    <section id="announcements"
             class="mb-12"
             aria-labelledby="announcements-heading">
        <h2 id="announcements-heading"
            class="text-2xl font-bold mb-6 text-foreground">{{ heading }}</h2>
        <div class="space-y-4">
            {% for announcement in announcements %}
                <article class="card p-6">
                    <h3 class="text-lg font-semibold text-foreground mb-2">{{ announcement.title }}</h3>
                    <p class="text-foreground-secondary whitespace-pre-line">{{ announcement.content }}</p>
                </article>
            {% endfor %}
        </div>
    </section>
{% endif %}
