{% load i18n tessera %}
{# Label innards for one organizer-defined field: icon, question, required marker, #}
{# visibility badge. Shared by the <label>, the <legend> and the checkbox's <span>. #}
{# In place the badge goes: the box a field sits in already says who sees it. #}
{% if icon_name %}
    {% if inplace %}
        {% icon icon_name class="w-4 h-4 inline mr-1" variant="mini" %}
    {% else %}
        {% icon icon_name class="w-4 h-4 inline mr-1 text-foreground-muted" %}
    {% endif %}
{% endif %}
{{ label }}
{% if is_required %}
    <span class="text-danger" aria-hidden="true">*</span><span class="sr-only">({% translate "required" %})</span>
{% endif %}
{% if not inplace %}
    {% include "components/visibility-icon.html" with is_public=is_public only %}
{% endif %}
