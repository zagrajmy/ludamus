{% load tessera %}
{# Icon-only action button: a control whose whole label is its icon, so the #}
{# accessible name has to be written rather than read off the contents. #}
{# Vars: icon (heroicon name), label (accessible name, required), id, #}
{# extra_class, icon_class. #}
<button type="button"
        {% if id %}id="{{ id }}"{% endif %}
        aria-label="{{ label }}"
        class="inline-flex items-center justify-center rounded-lg p-2 text-foreground-muted transition-opacity hover:opacity-70 cursor-pointer{% if extra_class|default:"" %} {{ extra_class }}{% endif %}">
    {% icon icon variant="mini" class=icon_class|default:"size-5" aria_hidden="true" %}
</button>
