{% load tessera %}
{# What components/stat_card.html holds, whether it is a link or not. #}
<div class="flex items-center justify-between gap-3">
    <div>
        <div class="text-2xl font-semibold tabular-nums">{{ value }}{% if of is not None %}/{{ of }}{% endif %}{{ suffix|default:"" }}</div>
        <div class="mt-0.5 text-xs text-foreground-muted">{{ label }}</div>
    </div>
    {% if icon %}
        <div class="size-10 shrink-0 rounded-lg flex items-center justify-center {% if tone == 'blue' %}bg-blue-100 text-blue-600 dark:bg-blue-100/20 dark:text-blue-400{% elif tone == 'purple' %}bg-purple-100 text-purple-600 dark:bg-purple-100/20 dark:text-purple-400{% elif tone == 'green' %}bg-green-100 text-green-600 dark:bg-green-100/20 dark:text-green-400{% else %}bg-yellow-100 text-yellow-600 dark:bg-yellow-100/20 dark:text-yellow-400{% endif %}">
            {% icon icon class="size-5" %}
        </div>
    {% endif %}
</div>
{% if note %}<p class="mt-2 hidden text-xs text-green-600 sm:block">{{ note }}</p>{% endif %}
