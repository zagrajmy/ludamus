{# A checkbox in a filled label: the flag row reads as options, a step #}
{# lighter than the fields beside it, and the box stays visible as on/off. #}
{# Variables: id, label (required), name, value, checked, hook_class. #}
<label class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-bg-tertiary text-sm font-medium text-foreground whitespace-nowrap cursor-pointer select-none transition-colors duration-150 hover:bg-border has-checked:bg-primary-light has-checked:text-primary">
    {% include "components/checkbox-input.html" with id=id name=name|default:"" value=value|default:"" checked=checked|default:False hook_class=hook_class|default:"" only %}
    <span>{{ label }}</span>
</label>
