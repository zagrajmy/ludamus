{% load i18n %}
<fieldset>
    <legend class="text-lg font-semibold text-foreground mb-2">{% translate "Days the facilitator could host" %}</legend>
    <p class="text-sm text-foreground-muted mb-4">
        {% translate "Days that would work for this session. These are preferences, not a final schedule." %}
    </p>
    <div class="space-y-2">
        {% for day in all_available_days %}
            <label class="flex items-center gap-2 text-sm py-3 rounded-md hover:bg-foreground/5">
                {% include "components/checkbox-field.html" with name="available_days" value=day|date:"Y-m-d" checked_values=selected_available_days label="" only %}
                {{ day|date:"l, M j" }}
            </label>
        {% endfor %}
    </div>
</fieldset>
