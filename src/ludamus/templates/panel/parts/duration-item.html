{% load tessera %}
{# One allowed duration of a category; duration-list.ts clones it blank from a <template>. #}
<div data-duration-item
     class="flex items-center justify-between py-2 px-3 bg-bg-tertiary rounded-lg">
    <span class="text-sm text-foreground-secondary" data-duration-label>{{ label }}</span>
    <input type="hidden" name="durations" value="{{ value }}">
    <button type="button"
            data-remove-duration
            class="text-foreground-muted hover:text-danger transition">{% icon "x-mark" class="w-4 h-4" %}</button>
</div>
