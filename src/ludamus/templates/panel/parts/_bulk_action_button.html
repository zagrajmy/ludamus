{# One submit button of the bulk-status toolbar. #}
{# Variables: label, name, value, variant (primary/secondary/danger). #}
{# data-bulk-action is bulk-status.ts's hook — it disables these while #}
{# nothing is selected — so the attribute lives here rather than on each page. #}
<button type="submit"
        name="{{ name }}"
        value="{{ value }}"
        data-bulk-action
        class="btn btn-{{ variant|default:'secondary' }} text-sm">{{ label }}</button>
