{% load i18n %}
<fieldset>
    <legend class="text-lg font-semibold text-foreground mb-2">{% translate "When the facilitator could host" %}</legend>
    <p class="text-sm text-foreground-muted mb-4">
        {% translate "Times that would work for this session. These are preferences, not a final schedule." %}
    </p>
    <div class="space-y-4">
        {% for entry in availability_options %}
            <div>
                <h4 class="text-sm font-medium text-foreground mb-2">{{ entry.day|date:"l, M j" }}</h4>
                <div class="space-y-2">
                    {% for part in entry.parts %}
                        <label class="flex items-center gap-2 text-sm py-2 rounded-md hover:bg-foreground/5">
                            {% include "components/checkbox-input.html" with name="availability" value=part.value checked=part.is_selected only %}
                            {{ part.label }}
                        </label>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
</fieldset>
