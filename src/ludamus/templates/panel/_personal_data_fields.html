{% load tessera %}
{% comment %}
Renders personal-data field inputs. Caller passes:
  descriptors — list of FieldDescriptor (field, name_prefix, answer)
{% endcomment %}
<div class="space-y-6">
    {% for desc in descriptors %}
        {% dynamic_field desc.field name_prefix=desc.name_prefix answer=desc.answer %}
    {% endfor %}
</div>
