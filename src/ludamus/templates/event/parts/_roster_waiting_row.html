{% load i18n %}
{# One person on the modal's waiting list. The row whose user is #}
{# `current_user` is the viewer's own; session-roster.ts adds and removes it as they join or leave. #}
<div data-waiting-list-row
     class="flex items-center justify-between p-3 rounded-xl {% if user.pk == current_user.pk %}bg-coral-50 dark:bg-coral-950 border border-coral-200 dark:border-coral-800{% else %}bg-warm-100 dark:bg-neutral-800{% endif %}"
     {% if user.pk == current_user.pk %}data-roster-self{% endif %}>
    <div class="flex items-center gap-3">
        <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold bg-warning-light text-warning-text"
              data-waiting-position
              data-position-label="{% translate "Waiting list position" %}"></span>
        <span class="font-medium text-foreground" data-ph-mask>{{ user.full_name }}</span>
    </div>
    <div class="flex items-center gap-2">
        {% if user.pk == current_user.pk %}
            <span class="text-xs font-medium text-coral-600">{% translate "You" %}</span>
        {% endif %}
        <span class="text-xs text-foreground-muted">{{ joined_label }}</span>
    </div>
</div>
