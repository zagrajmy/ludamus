{% load i18n %}
<div class="{% if is_first_step %}flex justify-end{% else %}flex flex-col-reverse sm:grid sm:grid-cols-2 gap-3{% endif %} pt-6">
    {% if not is_first_step %}
        <button type="button"
                class="btn btn-secondary"
                hx-post="{{ back_url }}"
                hx-target="#wizard-content"
                hx-swap="outerHTML show:#wizard-content:top"
                hx-vals='{"back": "1"}'>← {% translate "Back" %}</button>
    {% endif %}
    <button type="submit" class="btn btn-primary">{% translate "Continue" %} →</button>
</div>
