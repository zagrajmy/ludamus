{% load i18n tessera %}
{% if show_login_nudge|default:False %}
    <div class="mb-4">
        <h2 class="font-semibold mb-1">{% translate "Have an account?" %}</h2>
        <p class="mb-2 text-sm text-foreground-muted">
            {% translate "Log in to save your details across submissions, track your proposals, and skip re-entering personal data next time." %}
        </p>
        <a href="{{ login_url }}" class="btn btn-primary">{% translate "Log in" %}</a>
    </div>
{% endif %}
