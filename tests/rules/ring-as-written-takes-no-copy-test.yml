id: ring-as-written-takes-no-copy
valid:
  - |
    ring_as_written(
        recipient_ids=ids, kind=kind, title=announcement.title, body=body, url=""
    )
  - "ring_as_written(recipient_ids=ids, **form.cleaned_data)"
invalid:
  - 'ring_as_written(recipient_ids=ids, kind=kind, title=_("Closed"), body="", url="")'
  - |
    ring_as_written(
        recipient_ids=ids,
        kind=kind,
        title=title,
        body=gettext("Event cancelled: %(e)s") % {"e": name},
        url="",
    )
  - 'ring_as_written(recipient_ids=ids, kind=k, title=t, body=ngettext("a", "b", n), url="")'
  - 'ring_as_written(recipient_ids=ids, kind=k, title=translation.gettext_lazy("x"), body="", url="")'
