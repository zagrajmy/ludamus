# Loaded only when MISE_ENV=sandbox — set by .claude/hooks/session-start.sh in
# Claude Code web sandboxes, where the egress proxy 403s every GitHub download
# (api.github.com included). Laptops never load this file.
#
# [tool_alias] remaps each GitHub-release tool from mise.toml to a reachable
# registry backend; versions stay pinned in mise.toml alone. python is not
# aliased: the session hook builds a Python 3.14 .venv with uv instead. pipx
# comes from apt and serves the pipx: backends.

[settings]
disable_tools = ["python", "pipx", "github:reteps/dockerfmt"]
# npm.package_manager = "npm" moved to mise.toml — the aube-shim bootstrap
# problem it solves also hits fresh CI runners, not just sandboxes.

[tool_alias]
hk = "cargo:hk"
# The pipx wrappers version as <upstream>.<wrapper-rev> (0.11.0.1 wraps
# 0.11.0), which is why mise.toml pins these two with `prefix:` — an exact pin
# reaches uv as `==0.11.0` and matches nothing on PyPI.
shellcheck = "pipx:shellcheck-py"
actionlint = "go:github.com/rhysd/actionlint/cmd/actionlint"
hadolint = "pipx:hadolint-py"

# Two pins are duplicated here; the session hook warns when either drifts from
# mise.toml (sandboxes once ran dockerfmt 0.5.2 against laptops' 0.5.4).
#
# dockerfmt can't be aliased: its mise.toml key is already a full backend spec.
#
# hk is re-pinned without mise.toml's `workflow` option. That option belongs to
# the GitHub-release backend; once [tool_alias] routes hk to cargo, mise
# (2026.10.25 on) rejects it, and since `mise run` installs missing tools first,
# every task in the session aborted on it.
[tools]
"go:github.com/reteps/dockerfmt" = "v0.5.4"
hk = "2.7.0"
