# Loaded only when MISE_ENV=sandbox — set by .claude/hooks/session-start.sh in
# Claude Code web sandboxes, where the egress proxy 403s every GitHub download
# (api.github.com included). Laptops never load this file.
#
# [tool_alias] remaps each GitHub-release tool from mise.toml to a reachable
# registry backend. Versions stay pinned in mise.toml except for the three the
# [tools] table at the bottom re-pins, each for a reason spelled out there.
# python and pipx come from apt instead (the sandbox image preconfigures the
# deadsnakes PPA); apt pipx serves the pipx: backends.

[settings]
disable_tools = ["python", "pipx", "github:reteps/dockerfmt"]
# npm.package_manager = "npm" moved to mise.toml — the aube-shim bootstrap
# problem it solves also hits fresh CI runners, not just sandboxes.

[tool_alias]
hk = "cargo:hk"
shellcheck = "pipx:shellcheck-py"
actionlint = "go:github.com/rhysd/actionlint/cmd/actionlint"
hadolint = "pipx:hadolint-py"

# Every pin below duplicates one in mise.toml and has to be bumped with it —
# nothing validates the two files against each other, and dockerfmt's copy had
# already drifted two patches behind before this comment existed.
#
# dockerfmt can't be aliased (its mise.toml key is already a full backend spec),
# so the version has to be repeated verbatim.
#
# The two pipx wrappers are here for a different reason: they version as
# <upstream>.<wrapper-rev> (shellcheck-py 0.11.0.1 wraps shellcheck 0.11.0), and
# mise hands a full X.Y.Z pin to uv verbatim as ==X.Y.Z, which matches nothing on
# PyPI. `mise install` then fails outright and takes every `mise run` down with
# it. A minor-version prefix resolves to the newest wrapper rev of that upstream
# release, so these only need touching when mise.toml moves off 0.11 / 2.14.
# Loosening the pin in mise.toml itself would delete all three lines, but only
# if `X.Y` also prefix-resolves through the default aqua backend that laptops
# and CI use — unverifiable from a sandbox where GitHub is 403'd.
[tools]
"go:github.com/reteps/dockerfmt" = "v0.5.4"
shellcheck = "0.11"
hadolint = "2.14"
