---
name: Mise tools
description: >-
  Install the mise toolchain, retrying when a tool download fails for reasons
  that have nothing to do with this repository.

inputs:
  cache:
    required: false
    default: "true"
    description: Passed to mise-action; false skips reading and writing its cache.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        # The install moves to the step below so a failed download can be
        # retried; this step only puts mise itself on the PATH.
        install: false
        cache: ${{ inputs.cache }}
    # mise retries an HTTP failure three times over about twenty seconds, which
    # covers a blip and not an outage: a run died to consecutive 504s from the
    # GitHub release host serving python-build-standalone and pipx, having
    # tested nothing. The backoff here is minutes rather than seconds, so a
    # short outage costs a slow job instead of a red one that says nothing
    # about the branch.
    - name: Install tools
      shell: bash
      run: |
        set -uo pipefail
        for wait in 30 90 0; do
          if mise install; then
            exit 0
          fi
          if [ "$wait" -eq 0 ]; then
            break
          fi
          echo "::warning title=mise install failed::retrying in ${wait}s"
          sleep "$wait"
        done
        echo "::error title=mise install failed::tools did not install after 3 attempts"
        exit 1
