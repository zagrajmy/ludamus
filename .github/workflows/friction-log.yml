---
name: Friction Log

on:
  push:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: friction-log
  cancel-in-progress: false

permissions: {}

jobs:
  friction-log:
    name: Friction Log
    if: >-
      (github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'issues' ||
      github.event.issue.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Report and reconcile frictions
        id: frog
        uses: wevm/frog/action@702c4eadefe175a208290a99c36e7f4ac1390e53
        with:
          version: '1.1.0'
          issue-author: github-actions[bot]
      - name: Start the sync pull request's checks
        continue-on-error: true
        if: >-
          steps.frog.outputs.created != '0' ||
          steps.frog.outputs.updated != '0' ||
          steps.frog.outputs.removed != '0' ||
          steps.frog.outputs.reopened != '0' ||
          steps.frog.outputs.cleared != '0'
        env:
          GH_TOKEN: ${{ secrets.FROG_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push raises no pull_request event, so the required
          # checks never start. Reopening under a PAT raises one.
          # A secret set from `echo` keeps its newline, which the API rejects.
          GH_TOKEN="${GH_TOKEN//[$'\t\r\n ']/}"
          if [ -z "${GH_TOKEN}" ]; then
            echo '::warning::FROG_SYNC_TOKEN is unset; the sync pull request will have no checks.'
            exit 0
          fi
          pr="$(gh pr list --head frog/sync --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then exit 0; fi
          gh pr close "$pr"
          gh pr reopen "$pr"
