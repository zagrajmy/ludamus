name: Dispatch staging deploy

on:
  pull_request_target:
    types: [ labeled, synchronize, reopened ]

permissions:
  contents: read

jobs:
  dispatch-from-pr:
    name: Dispatch staging deploy from PR
    # NOTE: every PR push fired this for a one-second no-op. Adding the label
    # sends its own `labeled` event, so the payload's labels are fresh enough;
    # the script still re-reads the PR before it dispatches.
    if: contains(github.event.pull_request.labels.*.name, 'staging')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const staging = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-staging.mts`)
            );
            await staging.handlePullRequest({ github, context, core });
