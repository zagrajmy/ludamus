name: Deploy to Coolify

# Shared body of deploy-staging.yml and deploy-production.yml. It used
# to be copy-pasted, and the copy drifted: two rounds of staging hardening
# (env-validation source, deploy-trigger retry, curl timeouts) never reached
# production. Living here once makes it structurally impossible for one
# environment to run weaker code than the other.
#
# `vars` and `secrets` below resolve against the GitHub Environment named by
# `inputs.environment`, declared on this job — that is what keeps the ~30-line
# config block in one place instead of one copy per caller.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment supplying the vars and secrets.
        required: true
        type: string
      environment_url:
        description: Deployed site, shown on the job. Empty until an app serves one.
        required: false
        default: ''
        type: string
      sha:
        description: Commit to build, deploy and pin the image tag to.
        required: true
        type: string
      is_staging:
        description: Sets IS_STAGING in the app's runtime config.
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Build image and deploy to Coolify
    runs-on: ubuntu-latest
    # Backstop for a hung Coolify API: callers serialize on a concurrency
    # group, and GitHub's default ceiling is 6 hours — long enough to block a
    # rollback behind a stuck run.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment_url }}
      # Callers that track deployments do it themselves, around this job.
      deployment: false
    steps:
      - name: Checkout (provides .env.schema for varlock validation)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # varlock comes from the lockfile rather than a version pinned a second
      # time here. --no-install below then makes a missing one fail loudly
      # rather than cold-start an unpinned fetch mid-deploy.
      - uses: jdx/mise-action@v2
      - run: aube install --no-optional

      - name: Build Coolify env payload and validate with varlock
        env:
          # Not configured in the GitHub Environment — hardcoded here.
          ENV: production
          # Empty rather than 'false' so the loop below skips it entirely,
          # exactly as the production workflow did before it shared this body.
          IS_STAGING: ${{ inputs.is_staging && 'true' || '' }}
          DJANGO_SETTINGS_MODULE: ludamus.edges.settings
          DEBUG: 'false'
          TARGET_SHA: ${{ inputs.sha }}
          # Non-sensitive config — GitHub Environment variables.
          USE_POSTGRES: ${{ vars.USE_POSTGRES }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          SESSION_COOKIE_DOMAIN: ${{ vars.SESSION_COOKIE_DOMAIN }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          STATIC_ROOT: ${{ vars.STATIC_ROOT }}
          MEDIA_ROOT: ${{ vars.MEDIA_ROOT }}
          GS_BUCKET_NAME: ${{ vars.GS_BUCKET_NAME }}
          GS_LOCATION: ${{ vars.GS_LOCATION }}
          # Per-environment, and the seam a second PostHog project would use:
          # set here it wins, unset it falls back to .env.production, which is
          # the production baseline and would put staging in that project.
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          # Sensitive config — GitHub Environment secrets.
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          GS_CREDENTIALS_JSON: ${{ secrets.GS_CREDENTIALS_JSON }}
          EMAIL_URL: ${{ secrets.EMAIL_URL }}
        run: |
          set -euo pipefail
          # Previously injected by compose `environment:` on the host.
          GIT_COMMIT_SHA="$(printf '%.7s' "$TARGET_SHA")"
          export GIT_COMMIT_SHA
          # varlock resolves .env.schema against the process env above, which
          # overrides the committed files, and exits non-zero if a @required
          # var (incl. forEnv(production) ones) is missing or malformed. The
          # resolved set *is* the payload — deriving envs.json from it rather
          # than from a second, hand-kept list of keys means a var added to the
          # schema reaches Coolify without also having to be added here.
          #
          # Dropping empty values keeps the bulk-env upsert from clearing a
          # value Coolify already stores. Piped, never printed: resolved
          # secrets stay out of the run log.
          aube exec --no-install varlock load --format json --filter='!#compose' \
            | jq '[to_entries[]
                   | select(.value != null and .value != "")
                   | {key: .key, value: (.value | tostring), is_preview: false}]' \
            > envs.json

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-image.yml already pushes this tag for main commits. Building here
      # anyway removes the race against that workflow and allows deploying a
      # non-main commit; the shared GHA cache makes it near-free either way.
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          # sha- prefix matches build-image.yml's metadata-action tags.
          tags: ghcr.io/${{ github.repository }}:sha-${{ inputs.sha }}
          # Build-only values; runtime config is synced to Coolify below.
          build-args: |
            ENV=production
            DJANGO_SETTINGS_MODULE=ludamus.edges.settings
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync environment to Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          # envs.json values were varlock-validated above. Output is
          # discarded so values never reach the run log.
          jq '{data: .}' envs.json | curl -fsS -X PATCH \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- \
            "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs/bulk" > /dev/null

      - name: Pin image tag
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # Pinning the exact sha tag (not `latest`) makes rollback a
          # re-dispatch of the calling workflow on an older commit.
          jq -n --arg tag "sha-$TARGET_SHA" '{docker_registry_image_tag: $tag}' \
            | curl -fsS -X PATCH \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $COOLIFY_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                "$COOLIFY_URL/api/v1/applications/$APP_UUID" > /dev/null

      - name: Deploy on Coolify and wait
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          set -eu
          # Retried because under `set -eu` one dropped response here would
          # kill the job after the image push, env sync, and tag pin — leaving
          # Coolify holding the new env and pinned tag with no deploy running,
          # for the next unrelated redeploy to ship silently. A duplicate
          # trigger just redeploys the same pinned image.
          deployment_uuid=''
          for attempt in 1 2 3; do
            deployment_uuid="$(curl -fsS -X POST \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID" \
              | jq -re '.deployments[0].deployment_uuid' || true)"
            if [ -n "$deployment_uuid" ]; then
              break
            fi
            echo "Deploy trigger attempt $attempt failed" >&2
            sleep 5
          done
          if [ -z "$deployment_uuid" ]; then
            echo "Could not trigger Coolify deployment" >&2
            exit 1
          fi
          echo "Coolify deployment: $deployment_uuid"
          # Poll so the run (and the GitHub deployment status) reflects the
          # real outcome: 60 polls, 10s apart — ~10 min when the API is
          # healthy, up to ~40 min if every request drags to its 30s
          # --max-time. The image CMD is prod-start, which runs migrate +
          # collectstatic before gunicorn.
          for i in $(seq 1 60); do
            sleep 10
            # One bad poll must not crash the watch under `set -eu`: a
            # garbled body falls back to transient_error via jq's exit
            # code, and a dead curl (no pipefail) yields an empty status;
            # either way the loop just retries.
            status="$(curl -fsS \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$deployment_uuid" \
              | jq -r '.status' || echo 'transient_error')"
            echo "[$i] status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed | cancelled*) echo "Deployment $status" >&2; exit 1 ;;
            esac
          done
          echo "Gave up waiting for Coolify deployment after 60 polls" >&2
          exit 1
