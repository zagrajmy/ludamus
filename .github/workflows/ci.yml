---
name: CI

on:
  pull_request:

  push:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: ./.github/actions/toolchain
      - run: mise bootstrap packages apply --yes
      # Not --no-optional: fallow's platform binary, which lint:fallow runs,
      # is an optional dependency.
      - run: aube install
      # Ahead of the lint, so a lint failure cannot hide a leaked secret.
      - run: aube exec varlock scan
      # Everything but Pylint, which the pylint job below runs in shards.
      - run: mise run lint:fast --jobs "$(nproc)"
      - name: Translations are fresh (extraction current, nothing untranslated/fuzzy)
        run: mise run messages-check

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [src, tests, cross]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise run lint:pylint:${{ matrix.shard }}

  frontend-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v4
      - run: mise install
      - name: install deps
        run: aube install
      # Blocking: oxlint (@hasparus/oxlint-config) must pass with zero
      # errors and zero warnings before the build is considered green.
      - name: Lint frontend TypeScript (oxlint)
        run: mise run lint-client
      - name: Type-check TypeScript
        run: mise run ts-check
      # The iOS specs themselves need a macOS runner and a simulator (see the
      # Mobile workflow); their pure helpers do not.
      - uses: oven-sh/setup-bun@v2
      - name: Unit-test the iOS regression helpers
        run: mise run test:ios-helpers
      - name: Unit-test the staging deploy resolver
        run: mise run test:staging-script

  audit-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise run dep:audit

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludamus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # PostgreSQL-only tests: row-level locking (select_for_update) is a
      # no-op on the SQLite backend used by the `test-unit` job below.
      - run: mise run test:postgres -- --cov
        env:
          COVERAGE_FILE: .coverage.postgres
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-postgres
          path: .coverage.postgres
          include-hidden-files: true
          retention-days: 7

  # The mills ratchet: tests/unit must cover ludamus.mills, ludamus.specs and
  # itself in full, which the combined report cannot show — an e2e-only branch
  # reads the same there.
  test-mills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise run test:unit:cov

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # NOTE: tests/conftest.py deals each test file to one shard by hash, and
      # the run below reads the count from strategy.job-total, the whole
      # matrix size. A second axis here would silently skip tests.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise run test:py:cov
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # mise task env pins COVERAGE_FILE, so the shard's name comes after.
      - name: Name this shard's coverage
        run: mv .coverage.unit .coverage.unit.${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: .coverage.unit.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    # A stuck `playwright install` has no timeout of its own and rode the 6h
    # job default; cap it so a hang fails in minutes instead of hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Seven shards in three groups (tests/e2e/playwright.config.ts): a shard
      # spends about two minutes on setup and seeding whatever its share of
      # the specs, so each further shard buys less, and concurrency is shared
      # account-wide. Grouped by project, because a plain --shard=i/7 cuts the
      # project-ordered list into unequal slices, some of them Firefox only.
      # NOTE: each group's shards must count up to its own total. A missing
      # "2/3" silently skips a third of that group; nothing else checks it.
      # Pull requests leave the Firefox group to the run on main: Firefox
      # repeats 376 specs Chromium already ran, two shards of seven, and main
      # does not deploy on its own, so a Firefox-only regression is caught
      # there before it ships. Every run that is not a pull request keeps it.
      # NOTE: a required check on a firefox shard would block every PR.
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]',
          '{"name":"chromium-1","group":"chromium","shard":"1/3"},
          {"name":"chromium-2","group":"chromium","shard":"2/3"},
          {"name":"chromium-3","group":"chromium","shard":"3/3"},',
          github.event_name != 'pull_request'
          && '{"name":"firefox-1","group":"firefox","shard":"1/2"},
          {"name":"firefox-2","group":"firefox","shard":"2/2"},' || '',
          '{"name":"rest-1","group":"rest","shard":"1/2"},
          {"name":"rest-2","group":"rest","shard":"2/2"}')) }}
    steps:
      - uses: actions/checkout@v7
      # NOTE: the browser install below is a no-op for browsers this cache
      # restored.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(
            'tests/e2e/package.json') }}
      - uses: ./.github/actions/toolchain

      # `playwright install-deps` shells out to apt for 181 packages
      # and 114MB, on every shard, every run. archive.ubuntu.com has measured
      # anywhere from 12s to 1m47s for that, and once hung for 452s on a
      # single 43kB package. Keep the .debs so a repeat run needs no mirror,
      # bound the wait when it does, and let apt retry.
      - name: Apt cache key
        id: apt
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Let the cache write the apt archive
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown "$USER" /var/cache/apt/archives
      # Only the .debs: apt's own partial/ is mode 0700, and the post-job save
      # runs as the runner user, which could not read it.
      - uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ steps.apt.outputs.key }}-${{ hashFiles(
            'tests/e2e/package.json') }}
          # A partial hit still helps: apt fetches only what is missing.
          restore-keys: |
            apt-${{ steps.apt.outputs.key }}-
      - name: Hand the apt archive back to root
        run: |
          sudo chown root:root /var/cache/apt/archives
          sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "60";
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          CONF
      # Each install step fails on its own cap rather than starving the specs
      # of the job budget and reporting as a 30min job timeout that names no
      # step.
      - name: Install Playwright Browsers
        timeout-minutes: 5
        run: mise run test:e2e:install:node && mise run test:e2e:install:browser
      - name: Install Playwright system deps
        timeout-minutes: 12
        # A stalled mirror can trickle past apt's own Acquire timeouts for as
        # long as the step allows, so cut each attempt short and retry; the
        # kept .debs make a retry cheap. As root, playwright calls apt-get
        # without sudo, so timeout can signal it. 3x190s + 2x60s fits 12min.
        run: |
          path="$(mise exec -- printenv PATH)"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 5 60 dpkg --configure -a || true
            fi
            if sudo env "PATH=$path" timeout -k 10 180 \
              aube exec --no-install -C tests/e2e playwright install-deps; then
              exit 0
            else
              rc=$?
            fi
            # 124: timed out; 137: killed after -k; else playwright's exit code.
            echo "::warning::Playwright system deps exited $rc (attempt $attempt/3)"
          done
          exit "$rc"
      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor,
      # which leaves Chromium "No usable sandbox!". Lift it so the specs run
      # Chromium sandboxed, as users get it.
      # The seeding inside Playwright's webServer command applies these too,
      # and there a slow download spends the 180s the server has to come up:
      # one stalled bottle took 149s of it and the shard ran no spec. Applied
      # here first, that call finds nothing left to fetch.
      - name: Install system packages
        timeout-minutes: 8
        run: mise bootstrap packages apply --yes
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run end-to-end tests
        env:
          E2E_CHROMIUM_SANDBOX: "1"
          E2E_PROJECT_GROUP: ${{ matrix.group }}
        run: mise run test:e2e -- --shard=${{ matrix.shard }}

      # The shards' artifacts merge into one directory in `test`, so each
      # shard's data file needs a name of its own. It cannot be named that way
      # from the start: mise task env overrides the inherited environment, so
      # `test:e2e` pins COVERAGE_FILE back to `.coverage.e2e` regardless.
      - name: Name this shard's coverage
        run: mv .coverage.e2e .coverage.e2e.${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-${{ matrix.name }}
          path: .coverage.e2e.${{ matrix.name }}
          include-hidden-files: true
          retention-days: 7
      # NOTE: Codecov posts codecov/patch as soon as the first upload for a
      # commit is processed, and that status is what stays. A shard's lcov is
      # one slice, so uploading it here reports a coverage drop while the
      # other shards and the Python report are still running. The aggregator
      # uploads one client report after every shard has finished.
      - name: Name this shard's client coverage
        if: ${{ hashFiles('coverage-client/lcov.info') != '' }}
        run: mv coverage-client/lcov.info "coverage-client/lcov.${{ matrix.name }}.info"
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles(format('coverage-client/lcov.{0}.info', matrix.name)) != '' }}
        with:
          name: client-coverage-${{ matrix.name }}
          path: coverage-client/lcov.${{ matrix.name }}.info
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: playwright-report-${{ matrix.name }}
          path: ./tests/e2e/playwright-report/
          retention-days: 30

  # The Workers: the e2e run fakes Parley's, so only these exercise the real
  # runtime (workerd, through the Workers Vitest pool).
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [board, parley]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v4
      # Not --no-optional: workerd's platform binary is an optional dependency.
      - run: aube install
      - run: aube run typecheck
      - run: aube run test

  # Named `test` because the branch ruleset requires that check; every job that
  # gates a merge goes in `needs`.
  test:
    runs-on: ubuntu-latest
    # NOTE: pylint ran inside the required `checks` job until it became its
    # own job, and frontend-analysis calls its lint blocking: neither could
    # fail a merge while missing from this list.
    needs:
      - pylint
      - frontend-analysis
      - test-mills
      - test-unit
      - test-postgres
      - test-e2e
      - test-worker
      - bombadil
    # SAFETY: GitHub reports a skipped job as success to a required check, so
    # anything that skips this one turns the merge gate green. always(), not
    # !cancelled(): a cancelled run skips under the latter and would pass.
    if: ${{ always() }}
    timeout-minutes: 15
    steps:
      - name: Every test job passed
        if: ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'skipped')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: client-coverage-*
          path: coverage-client
          merge-multiple: true
      - name: Require every coverage artifact
        id: client-coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          missing=0
          require() {
            if [ ! -f "$1" ]; then
              echo "missing $1" >&2
              missing=1
            fi
          }
          require .coverage.postgres
          require .coverage.unit.1
          require .coverage.unit.2
          require .coverage.unit.3
          for name in chromium-1 chromium-2 chromium-3 rest-1 rest-2; do
            require ".coverage.e2e.${name}"
            require "coverage-client/lcov.${name}.info"
          done
          if [ "$EVENT_NAME" != "pull_request" ]; then
            require .coverage.e2e.firefox-1
            require .coverage.e2e.firefox-2
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          files="$(find coverage-client -type f -name 'lcov.*.info' | sort | tr '\n' ',' | sed 's/,$//')"
          if [ -z "$files" ]; then
            echo "no client coverage" >&2
            exit 1
          fi
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files" | tr ',' '\n'
      - run: mise run coverage:combine
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.client-coverage.outputs.files }}
          flags: client
          disable_search: true
          fail_ci_if_error: true
      - name: Publish Codecov statuses
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true

  # Bend proofs and known findings under formal/; check.sh pins and verifies
  # the Bend release itself.
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ludamus
          key: bend-${{ runner.os }}-${{ hashFiles('formal/check.sh') }}
      - run: formal/check.sh

  # advisory: CrossHair's solver over the window-policy properties is minutes
  # per property, too slow to gate a merge on; it reports what it finds.
  properties-crosshair:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise run test:props:crosshair

  # Bombadil explores the seeded app at random, so a green run is a sample, not
  # a proof, and a red one may expose a bug the pull request did not write. It
  # gates anyway: a violation is a real bug, and main stays green only if it is
  # fixed before the next merge. The trace and screenshots land as an artifact;
  # `bombadil browser test --reproduce` replays them.
  bombadil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: mise bootstrap packages apply --yes
      - run: mise run test:bombadil
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bombadil-output
          path: bombadil-output/
          retention-days: 14

  # advisory: reports the branch's debt without blocking the merge
  tingle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tingle check needs history to find the merge-base
      - uses: jdx/mise-action@v4
      - run: mise exec -- poetry install
      - run: mise exec -- poetry run tingle check
