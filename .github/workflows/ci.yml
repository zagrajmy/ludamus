---
name: CI

on:
  pull_request:
    paths-ignore: [ "docs/**" ]

  push:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock',
            'mise.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: Drop stale virtualenv
        run: .venv/bin/python --version || rm -rf .venv
      - run: mise exec -- poetry install
      - run: mise bootstrap packages apply --yes
      # hk's oxlint/oxfmt use `aube exec --no-install`, so a partial
      # (--no-optional) graph is fine — they will not cold-start mid-lint.
      - run: aube install --no-optional
      - run: mise run lint --jobs "$(nproc)"
      - name: Translations are fresh (extraction current, nothing untranslated/fuzzy)
        run: mise run messages-check

  varlock-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: aube install --no-optional
      - run: aube exec varlock scan

  impeccable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: mise run lint:impeccable

  frontend-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: install deps
        run: aube install
      # Blocking: oxlint (@hasparus/oxlint-config) must pass with zero
      # errors and zero warnings before the build is considered green.
      - name: Lint frontend TypeScript (oxlint)
        run: mise run lint-client
      - name: Type-check TypeScript
        run: mise run ts-check
      # The iOS specs themselves need a macOS runner and a simulator (see the
      # Mobile workflow); their pure helpers do not.
      - uses: oven-sh/setup-bun@v2
      - name: Unit-test the iOS regression helpers
        run: mise run test:ios-helpers
      # Non-blocking: fallow surfaces dead code, duplication, and
      # complexity hotspots as a report without failing the build.
      - name: Analyze frontend TypeScript (fallow)
        continue-on-error: true
        run: mise run fallow

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludamus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock',
            'mise.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: Drop stale virtualenv
        run: .venv/bin/python --version || rm -rf .venv
      - run: mise exec -- poetry install
      # PostgreSQL-only tests: row-level locking (select_for_update) is a
      # no-op on the SQLite backend used by the `test-e2e` job below.
      - run: mise run test:postgres

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock',
            'mise.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: Drop stale virtualenv
        run: .venv/bin/python --version || rm -rf .venv
      - run: mise exec -- poetry install

      - run: mise run test:py:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    # A stuck `playwright install` has no timeout of its own and rode the 6h
    # job default; cap it so a hang fails in minutes instead of hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock',
            'mise.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-
      # NOTE: playwright install below still runs, for the apt deps; it is a
      # no-op for browsers this cache restored.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(
            'tests/e2e/package.json') }}
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: Drop stale virtualenv
        run: .venv/bin/python --version || rm -rf .venv
      - run: mise exec -- poetry install

      - name: Install Playwright Browsers
        run: mise run test:e2e:install
      - name: Run end-to-end tests
        run: mise run test:e2e -- --shard=${{ matrix.shard }}/4

      # NOTE: the client-coverage collector keys off COVERAGE_FILE ending in
      # `.coverage.e2e`, so the shard suffix goes on afterwards.
      - name: Name this shard's coverage
        run: mv .coverage.e2e .coverage.e2e.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: .coverage.e2e.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1
      # Codecov merges same-flag uploads for a commit, so each shard sends its
      # own slice; separate flags keep the Python gate a Python gate.
      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-client/lcov.info
          flags: client
          disable_search: true

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ./tests/e2e/playwright-report/
          retention-days: 30

  # Named `test` because the branch ruleset requires that check; it now
  # gates on the unit job and every e2e shard, and holds the 93% floor.
  test:
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock',
            'mise.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: Drop stale virtualenv
        run: .venv/bin/python --version || rm -rf .venv
      - run: mise exec -- poetry install

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: mise run coverage:combine
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true

  # advisory: reports the branch's debt without blocking the merge
  tingle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tingle check needs history to find the merge-base
      - uses: jdx/mise-action@v2
      - run: mise exec -- poetry install
      - run: mise exec -- poetry run tingle check
