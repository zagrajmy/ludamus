---
name: CI

on:
  pull_request:
    paths-ignore: [ "docs/**" ]

  push:
    branches: [ "master", "main" ]
    paths-ignore: [ "docs/**" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: ./.github/actions/toolchain
      - run: mise bootstrap packages apply --yes
      # hk's oxlint/oxfmt use `aube exec --no-install`, so a partial
      # (--no-optional) graph is fine — they will not cold-start mid-lint.
      - run: aube install --no-optional
      # Ahead of the lint, so a lint failure cannot hide a leaked secret.
      - run: aube exec varlock scan
      - run: mise run lint --jobs "$(nproc)"
      - name: Translations are fresh (extraction current, nothing untranslated/fuzzy)
        run: mise run messages-check

  frontend-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/aube/store
          key: aube-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            aube-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: mise install
      - name: install deps
        run: aube install
      # Blocking: oxlint (@hasparus/oxlint-config) must pass with zero
      # errors and zero warnings before the build is considered green.
      - name: Lint frontend TypeScript (oxlint)
        run: mise run lint-client
      - name: Type-check TypeScript
        run: mise run ts-check
      # The iOS specs themselves need a macOS runner and a simulator (see the
      # Mobile workflow); their pure helpers do not.
      - uses: oven-sh/setup-bun@v2
      - name: Unit-test the iOS regression helpers
        run: mise run test:ios-helpers
      # Non-blocking: fallow surfaces dead code, duplication, and
      # complexity hotspots as a report without failing the build.
      - name: Analyze frontend TypeScript (fallow)
        continue-on-error: true
        run: mise run fallow

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludamus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      # PostgreSQL-only tests: row-level locking (select_for_update) is a
      # no-op on the SQLite backend used by the `test-unit` job below.
      - run: mise run test:postgres

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain

      - run: mise run test:py:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    # A stuck `playwright install` has no timeout of its own and rode the 6h
    # job default; cap it so a hang fails in minutes instead of hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Three, not four: concurrency is shared account-wide, and a fourth
      # shard buys under a minute against the odds of one queueing for five.
      # NOTE: the run below reads the count from strategy.job-total, which is
      # the whole matrix size. A second axis here would silently halve the
      # suite; split the denominator back out if one is ever added.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # NOTE: playwright install below still runs, for the apt deps; it is a
      # no-op for browsers this cache restored.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(
            'tests/e2e/package.json') }}
      - uses: ./.github/actions/toolchain

      # `playwright install --with-deps` shells out to apt, which has no
      # download timeout of its own: a hung mirror connection sat for 452s on
      # one 43 kB package and ate a whole shard's 30min budget. Sharding rolls
      # that dice once per shard, so bound the wait and let apt retry.
      - name: Bound apt downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF
      - name: Install Playwright Browsers
        # Fails in 10min rather than starving the specs of the job budget and
        # reporting as a 30min job timeout that names no step.
        timeout-minutes: 10
        run: mise run test:e2e:install
      - name: Run end-to-end tests
        run: mise run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The three artifacts merge into one directory in `test`, so each
      # shard's data file needs a name of its own. It cannot be named that way
      # from the start: mise task env overrides the inherited environment, so
      # `test:e2e` pins COVERAGE_FILE back to `.coverage.e2e` regardless.
      - name: Name this shard's coverage
        run: mv .coverage.e2e .coverage.e2e.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: .coverage.e2e.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7
      # Codecov merges same-flag uploads for a commit, so each shard sends its
      # own slice; separate flags keep the Python gate a Python gate.
      - name: Upload client coverage to Codecov
        if: ${{ hashFiles('coverage-client/lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-client/lcov.info
          flags: client
          disable_search: true

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ./tests/e2e/playwright-report/
          retention-days: 30

  # Named `test` because the branch ruleset requires that check; it now
  # gates on the unit job and every e2e shard, and holds the 93% floor.
  test:
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e]
    # SAFETY: GitHub reports a skipped job as success to a required check, so
    # anything that skips this one turns the merge gate green. always(), not
    # !cancelled(): a cancelled run skips under the latter and would pass.
    if: ${{ always() }}
    timeout-minutes: 15
    steps:
      - name: Every test job passed
        if: ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'skipped')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: mise run coverage:combine
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true

  # advisory: reports the branch's debt without blocking the merge
  tingle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tingle check needs history to find the merge-base
      - uses: jdx/mise-action@v2
      - run: mise exec -- poetry install
      - run: mise exec -- poetry run tingle check
