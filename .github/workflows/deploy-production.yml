name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Ahead of the app, which may call endpoints only the new Worker has.
  parley:
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-parley.yml
    with:
      environment: production-coolify
      stage: prod
      sha: ${{ github.sha }}
    secrets: inherit

  deploy:
    needs: parley
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: production-coolify
      environment_url: https://zagrajmy.net
      sha: ${{ github.sha }}
    secrets: inherit
