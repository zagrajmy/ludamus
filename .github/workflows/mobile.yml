---
name: Mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/ludamus/client/**"
      - "src/ludamus/templates/**"
      - "tests/e2e/**"
      - "scripts/ios-regressions/**"
      - ".github/workflows/mobile.yml"

# NOTE: keyed on the workflow name, not a literal prefix — ci.yml's group is the
# bare branch, so a prefix can collide with a branch of the same name. A
# superseded head's device run holds a macOS runner for most of an hour and
# queues the one that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-regressions:
    runs-on: macos-latest
    # See IOS_SPEC_BUDGET.
    timeout-minutes: 68
    env:
      # Every runner command is an HTTP request capped by
      # RUNNER_CONNECT_REQUEST_TIMEOUT_MS. At its 20s default a gesture or
      # snapshot that runs long aborts and is reported as a connect failure,
      # which makes agent-device kill and relaunch a runner that was healthy.
      AGENT_DEVICE_RUNNER_CONNECT_REQUEST_TIMEOUT_MS: 90000
      # Total deadline per runner command; has to exceed the per-request cap.
      AGENT_DEVICE_RUNNER_COMMAND_TIMEOUT_MS: 180000
      # Spawn to AGENT_DEVICE_RUNNER_LISTENER_READY measures 70s on these
      # runners, so at the 45s default the relaunch path can never succeed.
      AGENT_DEVICE_RUNNER_STARTUP_TIMEOUT_MS: 180000
      # Client-to-daemon, not runner-facing: it only has to outlast the above.
      AGENT_DEVICE_DAEMON_TIMEOUT_MS: 300000
      # How long openUrl keeps re-probing a Safari it has already told to open
      # the URL. It does not bound a probe: the first one pays this session's
      # runner launch (125-148s measured) and is awaited whatever this says.
      IOS_SAFARI_READY_TIMEOUT_MS: 60000
      # The number this job is sized from. A spec's worst case is two attempts
      # of the 360s hook plus the 30s afterAll and bun's start-up, ~14 minutes:
      # the test step's cap is budget × 14, and the job's cap is that plus the
      # 6.5 min of setup, 15 min warm-up cap and 1.5 min of teardown around it
      # plus 3 min of slack, so the step timeouts bind first. Actions cannot derive timeout-minutes
      # from an env value; raise the three together.
      IOS_SPEC_BUDGET: 3
      AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: 30000
      BASE_URL: http://localhost:8000
      SESSION: ios-regressions
    steps:
      - uses: actions/checkout@v4

      - name: Check the iOS spec budget
        run: |
          shopt -s nullglob
          files=(scripts/ios-regressions/*.ios.test.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no *.ios.test.ts files found in scripts/ios-regressions"
            exit 1
          fi
          if [ ${#files[@]} -gt "$IOS_SPEC_BUDGET" ]; then
            echo "::error::${#files[@]} iOS specs found; IOS_SPEC_BUDGET is $IOS_SPEC_BUDGET. Raise it with the two timeouts it sizes."
            exit 1
          fi

      - uses: jdx/mise-action@v2
        with:
          # ponytail: macOS poetry venv links to Homebrew's python framework;
          # caching it breaks when the runner image bumps python@3.14's patch
          # (dyld "Library not loaded" / Abort trap 6). Reinstall fresh instead.
          cache: false

      - uses: oven-sh/setup-bun@v2

      - run: mise install
      - run: mise exec -- poetry install

      # Split from the join below: booting takes ~2min of pure waiting that
      # the fixture bootstrap has no reason to sit behind. NOTE: a boot that
      # fails surfaces at the join, several steps and minutes from here.
      - name: Boot the iOS simulator (in the background)
        run: |
          UDID=$(python - <<'PY'
          import json
          import subprocess
          import sys

          output = subprocess.check_output([
              "xcrun",
              "simctl",
              "list",
              "devices",
              "available",
              "-j",
          ])
          devices = [
              device
              for runtime_devices in json.loads(output)["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          preferred = next((d for d in devices if d["name"] == "iPhone 17 Pro"), None)
          selected = preferred or devices[0]
          print(selected["name"], file=sys.stderr)
          print(selected["udid"])
          PY
          )
          xcrun simctl boot "$UDID" || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Bootstrap e2e fixtures
        run: mise run test:e2e:prep

      - name: Start local e2e server
        run: |
          mise run test:e2e:serve > ios-server.log 2>&1 &
          echo $! > ios-server.pid

      - name: Wait for local e2e server
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8000/event/autumn-open/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local e2e server did not become ready" >&2
          tail -200 ios-server.log >&2
          exit 1

      # Boot started before the fixture bootstrap, so by here it is usually
      # done; the simulator has to be up before the runner build below.
      - name: Join the iOS simulator boot
        run: xcrun simctl bootstatus "$UDID" -b

      # The XCUITest runner's build measures ~240s and is paid by the first
      # runner-backed command anywhere. Left inside a test hook it burns that
      # hook's budget and one of its attempts, so it gets its own step and its
      # own budget here. The runner itself is keyed to a session and stops with
      # it, so each spec still launches one -- only the build is shared.
      - name: Start Safari and warm up the agent-device runner
        # NOTE: the build is ~4 minutes with the machine to itself and has taken
        # over 10 while queued for a macOS runner; the cap has to fit the latter.
        timeout-minutes: 15
        run: bun run scripts/ios-regressions/warmup.ts

      - name: Run iOS Safari regressions
        # IOS_SPEC_BUDGET × 14.
        timeout-minutes: 42
        env:
          # Per-attempt cap: two attempts per spec of this plus the 30s afterAll
          # fit the step budget above.
          # The slowest healthy hook measures 316s.
          IOS_HOOK_TIMEOUT_MS: 360000
        run: |
          shopt -s nullglob
          files=(scripts/ios-regressions/*.ios.test.ts)

          # Per file rather than per suite, so a retry re-runs only what failed.
          # Two attempts each is what fits the step budget above.
          run_file() {
            for attempt in 1 2; do
              if bun test "$1"; then
                return 0
              fi
              echo "::warning::$(basename "$1") attempt ${attempt}/2 failed"
              # Retrying into a Safari left mid-gesture wastes the second
              # attempt. Nothing to terminate is already the desired state.
              xcrun simctl terminate "$UDID" com.apple.mobilesafari > /dev/null 2>&1 || true
            done
            return 1
          }

          status=0
          for file in "${files[@]}"; do
            run_file "$file" || status=1
          done
          exit "$status"

      - name: Stop local e2e server
        if: always()
        run: |
          if [ -f ios-server.pid ]; then
            kill "$(cat ios-server.pid)" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-regression-logs
          path: |
            ios-server.log
            ~/.agent-device/daemon.log
            ~/.agent-device/logs/
            ${{ runner.temp }}/ios-shots/
          retention-days: 14
