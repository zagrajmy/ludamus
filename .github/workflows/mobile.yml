---
name: Mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/ludamus/client/**"
      - "src/ludamus/templates/**"
      - "tests/e2e/**"
      - "scripts/ios-regressions/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  ios-regressions:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      E2E_EVENT_URL: http://localhost:8000/event/autumn-open/
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # ponytail: macOS poetry venv links to Homebrew's python framework;
          # caching it breaks when the runner image bumps python@3.14's patch
          # (dyld "Library not loaded" / Abort trap 6). Reinstall fresh instead.
          cache: false

      - uses: oven-sh/setup-bun@v2

      - run: mise install
      - run: mise exec -- poetry install

      - name: Install agent-device
        run: bun install -g agent-device@0.14.7

      - name: Prepare iOS simulator
        run: |
          UDID=$(python - <<'PY'
          import json
          import subprocess

          output = subprocess.check_output([
              "xcrun",
              "simctl",
              "list",
              "devices",
              "available",
              "-j",
          ])
          devices = [
              device
              for runtime_devices in json.loads(output)["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          preferred = next((device for device in devices if device["name"] == "iPhone 16"), None)
          selected = preferred or devices[0]
          print(selected["udid"])
          PY
          )
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Bootstrap e2e fixtures
        run: mise run test:e2e:prep

      - name: Start local e2e server
        run: |
          mise run test:e2e:serve > ios-server.log 2>&1 &
          echo $! > ios-server.pid

      - name: Wait for local e2e server
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --show-error "$E2E_EVENT_URL" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local e2e server did not become ready" >&2
          tail -200 ios-server.log >&2
          exit 1

      - name: Warm up the agent-device runner
        continue-on-error: true
        timeout-minutes: 6
        env:
          AGENT_DEVICE_DAEMON_TIMEOUT_MS: 90000
          AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: 30000
          BASE_URL: http://localhost:8000
          IOS_DEVICE_NAME: iPhone 16
          SESSION: ios-regressions
        run: bun run scripts/ios-regressions/warmup.ts

      - name: Run iOS Safari regressions
        timeout-minutes: 22
        env:
          # A daemon call that outlives the hook budget reports as an unnamed
          # 240s hook timeout with no attribution. Bounded well under the hook,
          # a wedged runner throws a named IOS_RUNNER_CONNECT_TIMEOUT instead.
          AGENT_DEVICE_DAEMON_TIMEOUT_MS: 90000
          AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: 30000
          IOS_HOOK_TIMEOUT_MS: 150000
          BASE_URL: http://localhost:8000
          IOS_DEVICE_NAME: iPhone 16
          SESSION: ios-regressions
        run: |
          # Retry per file, not per suite: a runner that dies in one file used
          # to take the next one down with it ("No active session"), and a
          # whole-suite retry re-ran files that had already passed.
          # Order is spelled out rather than globbed: scrubber is the cheaper
          # hook, and a glob would silently reorder on collation.
          attempts=3
          status=0
          for file in scrubber-longpress modal; do
            for attempt in $(seq 1 "$attempts"); do
              if bun test "scripts/ios-regressions/${file}.test.ts"; then
                continue 2
              fi
              echo "::warning::${file} attempt ${attempt} of ${attempts} failed"
              if [ "$attempt" -eq "$attempts" ]; then
                break
              fi
              xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
              sleep 15
            done
            status=1
          done
          exit "$status"

      - name: Stop local e2e server
        if: always()
        run: |
          if [ -f ios-server.pid ]; then
            kill "$(cat ios-server.pid)" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-regression-logs
          path: |
            ios-server.log
            ~/.agent-device/logs/
          retention-days: 14
