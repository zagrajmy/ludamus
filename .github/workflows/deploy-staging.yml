name: Deploy to staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy
        required: false
      sha:
        description: Commit SHA to deploy
        required: false

permissions:
  contents: read

# Only one staging deploy at a time; a newer push supersedes an in-flight one
# (last push to the labeled PR wins).
concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  resolve-staging:
    name: Resolve staging target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Removing the staging label from a PR needs issues=write AND
      # pull_requests=write; read here 403s.
      pull-requests: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: resolve
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const staging = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-staging.mts`)
            );
            await staging.resolveDeploy({ github, context, core });

  start-deployment:
    name: Create GitHub deployment
    needs: resolve-staging
    if: needs.resolve-staging.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      id: ${{ steps.deployment.outputs.id }}
    steps:
      # This job runs the helper scripts, not the deployed code, so the
      # workspace holds github.sha and there is no .workflow/ sleight of hand.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STAGING_URL: https://test.zagrajmy.net
          TARGET_SHA: ${{ needs.resolve-staging.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const staging = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-staging.mts`)
            );
            await staging.createStagingDeployment({
              github,
              context,
              core,
              sha: process.env.TARGET_SHA,
              environmentUrl: process.env.STAGING_URL,
            });

  deploy:
    needs: [resolve-staging, start-deployment]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: staging
      environment_url: https://test.zagrajmy.net
      sha: ${{ needs.resolve-staging.outputs.sha }}
      is_staging: true
    secrets: inherit

  finish-deployment:
    name: Mark GitHub deployment complete
    needs: [start-deployment, deploy]
    if: always() && needs.start-deployment.outputs.id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_ID: ${{ needs.start-deployment.outputs.id }}
          # `cancelled` and `skipped` both land on the `error` state, same as
          # the job-status value this replaced.
          JOB_STATUS: ${{ needs.deploy.result }}
          STAGING_URL: https://test.zagrajmy.net
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const staging = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-staging.mts`)
            );
            await staging.finishStagingDeployment({
              github,
              context,
              core,
              deploymentId: Number(process.env.DEPLOYMENT_ID),
              environmentUrl: process.env.STAGING_URL,
              jobStatus: process.env.JOB_STATUS,
            });
