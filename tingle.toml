[ranges.python]
include = ["src/**/*.py", "tests/**/*.py"]
default = true

[ranges.config]
include = ["pyproject.toml"]

[ranges.python-src]
include = ["src/**/*.py"]

[ranges.legacy-code]
include = ["src/ludamus/adapters/**/*.py", "src/**/legacy.py"]

[ranges.gates]
include = ["src/ludamus/gates/**/*.py"]

[ranges.old-subdomain-modules]
include = [
    "src/ludamus/**/chronology.py",
    "src/ludamus/**/chronology/**/*.py",
    "src/ludamus/**/submissions.py",
    "src/ludamus/**/submissions/**/*.py",
    "src/ludamus/**/multiverse.py",
    "src/ludamus/**/multiverse/**/*.py",
    "src/ludamus/**/crowd.py",
    "src/ludamus/**/crowd/**/*.py",
    "src/ludamus/**/notice_board.py",
    "src/ludamus/**/notice_board/**/*.py",
]

[ranges.python-tests]
include = ["tests/**/*.py"]

[ranges.python-tests-int]
include = ["tests/integration/**/*.py"]

# Django templates only: the static HTML under src/ludamus/static/ (the og-card
# source, the viewport probe) cannot use the template tags these metrics push
# towards.
[ranges.templates]
include = ["src/ludamus/templates/**/*.html"]

# A branch may take on debt in one metric if it pays off as much elsewhere.
[check]
policy = "sum"

# Formatting

[[metrics]]
base = "tingle.builtins.black.fmt_comment"

[[metrics]]
base = "tingle.builtins.taplo.ignore_comment"

[[metrics]]
base = "tingle.builtins.codespell.ignore_comment"

[[metrics]]
base = "tingle.builtins.ruff.noqa_comment"

[[metrics]]
name = "ruff-comment"
type = "regex_count"
group = "linting"
pattern = '#\s*ruff:'

[[metrics]]
base = "tingle.builtins.ruff.lint_ignores"

[[metrics]]
base = "tingle.builtins.ruff.per_file_ignores"

[[metrics]]
base = "tingle.builtins.pylint.disable_comment"

[[metrics]]
base = "tingle.builtins.pylint.rcfile_disables"
name = "pylint-disables"

# testing

[[metrics]]
name = "pragma-comment"
type = "regex_count"
group = "testing"
pattern = '#\s*pragma'
ranges = ["python-tests"]

[[metrics]]
base = "tingle.builtins.unittest_mock.any_used"
name = "mock-ANY"
ranges = ["python-tests"]
ignore_lines = ['(?:\b|_)(view|form|formset|import)\b']

[[metrics]]
name = "pointless-assert"
type = "regex_count"
group = "testing"
pattern = '=\w+\.context_data'
ranges = ["python-tests"]

[[metrics]]
name = "pytest-skip"
type = "regex_count"
group = "testing"
pattern = 'mark\.skip'
ranges = ["python-tests"]

[[metrics]]
name = "pytest-xfail"
type = "regex_count"
group = "testing"
pattern = 'mark\.xfail'
ranges = ["python-tests"]

[[metrics]]
name = "wrong-assert"
type = "regex_count"
group = "testing"
pattern = 'assert response\.'
ranges = ["python-tests-int"]

# typing

[[metrics]]
base = "tingle.builtins.mypy.type_ignore_comment"
ignore_lines = ['class.*admin\.TabularInline', 'class.*admin\.ModelAdmin']
ranges = ["python-src"]

[[metrics]]
base = "tingle.builtins.mypy.overrides"

[[metrics]]
base = "tingle.builtins.python.any_used"
name = "type-any"
ranges = ["python-src"]
ignore_lines = ['^from ', '^\s+Any,$']

[[metrics]]
name = "type-object"
type = "regex_count"
group = "typing"
pattern = '(?<![\.\w])object\b(?!-)'
ranges = ["python-src"]

[[metrics]]
name = "type-cast"
type = "symbol_uses"
group = "typing"
symbol = 'cast'
ranges = ["python-src"]

[[metrics]]
name = "mypy-strictness-holes"
type = "regex_count"
group = "typing"
pattern = 'disallow_\w+ = false'
ranges = ["config"]

# refactoring

[[metrics]]
name = "request-di-uow-files"
type = "regex_spread"
group = "refactoring"
pattern = 'request\.di\.uow'

[[metrics]]
name = "legacy-files"
type = "file_count"
group = "refactoring"
ranges = ["legacy-code"]

# A file past the template's line gate has stopped being one thing. Counts
# crossings both ways, so splitting one back under the gate pays for pushing
# another over.
[[metrics]]
base = "tingle.builtins.python.long_files"
name = "giant-files"
group = "refactoring"
ranges = ["python-src"]

# Old subdomain names (noun/verb migration): chronology+submissions -> event,
# crowd -> user, multiverse -> sphere, notice_board -> encounter
[[metrics]]
name = "old-subdomain-files"
type = "file_count"
group = "refactoring"
ranges = ["old-subdomain-modules"]

[[metrics]]
name = "script-tags"
type = "regex_count"
group = "refactoring"
pattern = "<script"
ranges = ["templates"]

[[metrics]]
name = "context-data-not-typed"
type = "regex_count"
group = "typing"
pattern = 'def get_context_data\(.*dict\[str, Any\]:'
ranges = ["python-src"]

# Import-linter contracts commented out because the codebase breaks them today.
# Fix the imports, then uncomment the rule.
[[metrics]]
name = "import-linter-disabled"
type = "regex_count"
group = "refactoring"
pattern = '#\s*("ludamus\.|\[\[tool\.importlinter)'
ranges = ["config"]

[[metrics]]
name = "adapter-imports-in-gates"
type = "regex_count"
group = "refactoring"
pattern = 'from ludamus\.adapters'
ranges = ["gates"]

[[metrics]]
name = "todo-comments"
type = "regex_count"
group = "refactoring"
pattern = '#\s*(TODO|FIXME|XXX|HACK)'
ranges = ["python-src", "templates"]

# frontend

[[metrics]]
name = "inline-styles"
type = "regex_count"
group = "frontend"
pattern = 'style="'
ranges = ["templates"]

[[metrics]]
name = "inline-handlers"
type = "regex_count"
group = "frontend"
pattern = '\son(click|change|submit|input|load)='
ranges = ["templates"]

[[metrics]]
name = "template-filter-safe"
type = "regex_count"
group = "frontend"
pattern = '\|\s*safe\b'
ranges = ["templates"]

[[metrics]]
name = "raw-form-controls"
type = "regex_count"
group = "frontend"
pattern = '<select\b|type="checkbox"'
ranges = ["templates"]

[[metrics]]
name = "template-hardcoded-text"
type = "regex_count"
group = "frontend"
pattern = '(placeholder|title|alt|aria-label)="[A-ZŁŚĆŹŻĄĘÓa-złśćźżąęó][^"{%]{4,}"'
ranges = ["templates"]
