[settings]
experimental = true
# We switch to multitask mode
# use run = [...] to enforce synchronous run
# user depends = [...] to allow asynchronous execution
jobs = 8
# Mid-bootstrap (fresh runners, sandboxes) the auto-detected aube shim can't
# resolve yet and its self-install can leave a broken .aube store (bit the
# macOS CI runner on aube 1.32.0), so mise's npm backend uses plain npm.
npm.package_manager = "npm"

[hooks]
enter = "poetry install"

# Claude Code web's sandbox proxy 403s every GitHub download (api.github.com
# included), so tools prefer npm/PyPI backends; mise.sandbox.toml substitutes
# the rest there (activated via MISE_ENV=sandbox — see docs/agents/sandbox.md).
# The npm_args below re-enable install scripts: both packages need them
# (@ast-grep/cli postinstall, @endevco/aube preinstall fetch the platform
# binary).
[tools]
python = "3.14"
node = "25.6.1"
"pipx:poetry" = "2.4.1"
"npm:@ast-grep/cli" = { version = "0.44.1", npm_args = "--ignore-scripts=false" }
markdownlint-cli2 = "0.23.1"
# Pinned (not "latest"): fresh macOS runners resolve the dist-tag directly,
# which skips .npmrc's min-release-age cooldown and picked up the broken
# 1.32.0 the day it shipped.
"npm:@endevco/aube" = { version = "1.31.0", npm_args = "--ignore-scripts=false" }
hk = "1.51.0"
actionlint = "1.7.12"
# `prefix:` (not a bare "0.11.0"): in sandboxes these two resolve to PyPI
# wrappers that append a packaging revision to the upstream version
# (shellcheck-py 0.11.0.1 wraps shellcheck 0.11.0). mise hands an exact pin to
# uv verbatim as `==0.11.0`, which matches nothing there; a prefix pin resolves
# against the registry and picks the wrapper. On GitHub-release backends the
# prefix matches the exact version, so laptops keep installing 0.11.0/2.14.0.
shellcheck = "prefix:0.11.0"
hadolint = "prefix:2.14.0"
"github:reteps/dockerfmt" = "0.5.4"
pipx = "1.16.0"

[env]
_.python.venv = { path = ".venv", create = true }
_.path = "/opt/homebrew/opt/gettext/bin:/usr/local/opt/gettext/bin:/home/linuxbrew/.linuxbrew/opt/gettext/bin"
LD_LIBRARY_PATH = "/opt/homebrew/lib:/home/linuxbrew/.linuxbrew/lib"
PYTHONPATH = "src"
PACKAGE = "ludamus"
SRC_PATHS = "src"
TEST_PATHS = "tests"
# Enumerated rather than a bare `.claude`, which also contains
# `.claude/worktrees/<agent-id>/` — a git-ignored checkout of this whole repo,
# virtualenv included, on any machine that has run a Claude Code agent. Pylint
# and vulture have no gitignore awareness, so `.claude` cost pylint minutes per
# run and made `mise run lint` fail outright on vulture findings from worktree
# site-packages. Everything tracked under `.claude` lives in these two dirs.
SCRIPT_PATHS = "scripts .claude/hooks .claude/skills"
TOML_PATHS = "*.toml .taplo.toml docker/*.toml"

[bootstrap.packages]
"brew:libxml2" = "latest"
"brew:gettext" = "latest"

[task_config]
includes = ["tasks.toml", "python_tasks.toml"]

# Tasks

## Format

[tasks."format:djlint"]
description = "Lint Django templates and reformat them, CSS and JS included"
# scripts on PYTHONPATH: .djlint_rules.yaml registers T038U by module name, and
# djlint imports it with plain importlib.
env = { PYTHONPATH = "src:scripts" }
run = "djlint src --lint --reformat --format-css --format-js --profile=django"

[tasks."format:oxfmt"]
description = "Format frontend code with Oxfmt"
run = 'aube exec oxfmt --write "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css}"'

[tasks.format]
description = "Run all formatters"
run = [{ task = "format:py" }, { task = "format:djlint" }, { task = "format:oxfmt" }]

## Lint

[tasks."lint:ast-grep"]
description = "Run structural code pattern checks via ast-grep"
run = "ast-grep scan --error src tests"

[tasks."lint:djlint"]
description = "Lint Django templates and check formatting (no changes)"
env = { PYTHONPATH = "src:scripts" }
run = "djlint src --quiet --lint --check --format-css --format-js --profile=django"

[tasks."lint:impeccable"]
run = "python scripts/impeccable_lint.py"

[tasks."lint:hk"]
description = "Run every hk linter on all files (file hygiene, shell, yaml, docker, md)"
run = "hk check --all"

[tasks.lint]
description = "Run all linters"
depends = [
    { task = "lint:py" },
    { task = "lint:hk" },
    { task = "lint:ast-grep" },
    { task = "lint:djlint" },
    { task = "lint:impeccable" },
]

## Dependencies

[tasks.update]
description = "Update all dependencies: mise tools, pip, Poetry packages"
run = [{ task = "dep:upgrade:py" }]

## Tests

### End-to-End tests

[tasks."test:e2e"]
description = "Run end-to-end Playwright tests"
run = "./scripts/run_e2e.sh"
raw_args = true
env = { _.file = '.env.e2e', COVERAGE_FILE = "{{ config_root }}/.coverage.e2e" }
dir = "tests/e2e"

[tasks."test:e2e:install"]
description = "Install Playwright (node deps + browsers)"
run = ["aube install", "aube exec -C tests/e2e playwright install --with-deps"]

# One browser at a time, without --with-deps. The fallback session-start.sh uses
# when the task above fails: `playwright install` walks the browsers in a single
# sequential loop and rethrows the first download failure, so one unreachable
# artifact skips every browser behind it. Lives here rather than inline in the
# hook so the command and its working directory are stated once.
[tasks."test:e2e:install:browser"]
description = "Install a single Playwright browser (e.g. mise run test:e2e:install:browser webkit)"
run = "aube exec -C tests/e2e playwright install"
raw_args = true

[tasks."test:e2e:prep"]
description = "Migrate, seed fixtures, and build client for e2e tests"
run = [
    "poetry install",
    "aube install",
    'rm -f "{{ config_root }}/dev.e2e.sqlite3"',
    "django-admin migrate --noinput",
    "django-admin createcachetable",
    "django-admin downloadvendor",
    "python tests/e2e/scripts/bootstrap_data.py",
    "python tests/e2e/scripts/bootstrap_facilitators.py",
    "python tests/e2e/scripts/bootstrap_timetable.py",
    "python tests/e2e/scripts/bootstrap_confirmations.py",
    "python tests/e2e/scripts/bootstrap_dynamic_fields.py",
    # Inline, so the V8 coverage the run collects carries the map back to the
    # .ts sources with it.
    "aubr -C src/ludamus/client build -- --sourcemap inline",
]
env = { _.file = '.env.e2e', COVERAGE_FILE = "{{ config_root }}/.coverage.e2e" }

[tasks."test:e2e:kill"]
description = "Kill the e2e dev server (Django on :8000)"
run = "lsof -ti :8000 | xargs -r kill -9 2>/dev/null; echo 'E2E server killed'"

[tasks."test:e2e:serve"]
description = "Run the e2e dev server (assumes `test:e2e:prep` has run); restarts itself when a client rebuild replaces the Vite manifest"
run = '''
set -eu
# django_vite parses the manifest once per process, so a `vite build` while
# the server runs would leave it serving hashed asset URLs the rebuild just
# deleted (pages silently lose their JS). Watch the manifest and bounce the
# server when it changes; CI never rebuilds mid-run, so this only fires in
# interactive sessions.
manifest="src/ludamus/static/vite/manifest.json"
mtime() { stat -c %Y "$manifest" 2>/dev/null || echo missing; }
while true; do
  seen=$(mtime)
  coverage run --source=src -m django runserver --insecure --noreload localhost:8000 &
  server=$!
  trap 'kill "$server" 2>/dev/null; exit 0' INT TERM
  while kill -0 "$server" 2>/dev/null && [ "$(mtime)" = "$seen" ]; do
    sleep 2
  done
  if ! kill -0 "$server" 2>/dev/null; then
    wait "$server"
    exit $?
  fi
  echo "Vite manifest changed — restarting the e2e server with fresh assets"
  kill "$server" 2>/dev/null
  wait "$server" 2>/dev/null || true
done
'''
env = { _.file = '.env.e2e', COVERAGE_FILE = "{{ config_root }}/.coverage.e2e" }

[tasks."test:e2e:boot"]
description = "Run bootstrap script"
run = "python"
env = { _.file = '.env.e2e' }

### Other types

[tasks."test:postgres"]
description = "Run PostgreSQL-only tests (row locking / concurrency) on real Postgres"
run = "pytest -m postgres tests/integration"
env.ALLOWED_HOSTS = ".testserver"
env.AUTH0_CLIENT_ID = "test-auth0-client-id"
env.AUTH0_CLIENT_SECRET = "test-auth0-client-secret"
env.AUTH0_DOMAIN = "auth0.example.com"
env.USE_POSTGRES = "True"
env.DB_NAME = "ludamus_test"
env.DB_USER = "postgres"
env.DB_PASSWORD = "postgres"
env.DB_HOST = "localhost"
env.DB_PORT = "5432"
env.ENV = "test"
env.MEMBERSHIP_API_BASE_URL = ""
env.MEMBERSHIP_API_TOKEN = "membership-test-token"
env.PYTHONPATH = "src"
env.ROOT_DOMAIN = "testserver"
env.SECRET_KEY = "dev-secret-key"
env.SESSION_COOKIE_DOMAIN = ".testserver"
env.CREDENTIALS_ENCRYPTION_KEY = "gWc408f8j3ZQUm5Ly4EXQC2EwFRf50AhePkmZKL5N9E="
env.IN_TESTS = 'True'
env.ZEAL_RAISE = 'True'
# Tests drive DBOS explicitly (test_dbos_scheduler.py); never launch implicitly.
env.SCHEDULER_MODE = "cron"

[tasks."test:mutation"]
description = "Run mutation tests"
run = "pytest --gremlins tests"
env = { _.file = '.env.test', COVERAGE_FILE = "{{ config_root }}/.coverage.unit" }

## Complex

[tasks.diff-cover]
description = "Show test coverage for lines changed since main"
run = [
    { task = "test:py:cov" },
    { task = "test:e2e:kill" },
    "rm -f dev.e2e.sqlite3",
    { task = "test:e2e" },
    { task = "coverage:combine" },
    "coverage xml --data-file=.coverage",
    "diff-cover coverage.xml --compare-branch=main",
]

[tasks."coverage:combine"]
description = "Combine integration + e2e coverage and export XML"
run = """
set -eu
if [ -f .coverage.e2e ]; then
  coverage combine .coverage.unit .coverage.e2e
else
  coverage combine .coverage.unit
fi
coverage xml -o coverage.xml
coverage report --fail-under=93
"""
env.PYTHONPATH = "src"

[tasks.check]
run = [{ task = "format" }, { task = "lint" }]

[tasks.pr-fix]
description = "Pull Request Formatting and Readiness Check"
run = [
    "mise install",
    "poetry install",
    { task = "format" },
    { task = "messages" },
    { task = "lint" },
    { task = "messages-check" },
    "aube install --no-optional",
    "aube exec varlock scan",
    { task = "lint-client" },
    { task = "ts-check:ios" },
    { task = "test:py:cov", args = [
        '-xvv',
        '--fail-under=97',
    ] },
]

[tasks.devcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "format:djlint" },
    { task = "messages" },
    { task = "lint:djlint" },
    { task = "lint:py" },
    { task = "test:py:cov", args = [
        '-xvv',
        '--fail-under=98',
    ] },
    "coverage xml",
    "diff-cover coverage.xml --compare-branch=main --fail-under=100",
    { task = "lint:tingle" },
]

[tasks.fullcheck]
env.E2E_SKIP_IOS = "1"
run = [
    "poetry install",
    { task = "format" },
    { task = "lint" },
    { task = "diff-cover" },
    { task = "lint:tingle" },
]


## Other

[tasks.dc]
description = "Run docker compose for a target environment (local or prod)"
usage = '''
arg "<environment>" help="Target environment" {
  choices "local" "prod"
}
arg "[dc_args]" var=#true double_dash="optional"
'''
run = '''
GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-$(git rev-parse --short HEAD)}
aubr varlock \
  docker compose --env-file /dev/null \
    -f docker/compose/{{ usage.environment }}.yaml {{arg(name="dc_args")}}
'''

[tasks.shots]
description = "Screenshot URLs/paths via agent-browser (e.g. mise run shots -- / /events). Start a server first; set BASE_URL for non-default hosts."
usage = '''
arg "<targets>" var=#true help="Full URLs, or paths relative to $BASE_URL (default http://localhost:8000)"
'''
dir = "{{ config_root }}"
run = '''
set -eu
base="${BASE_URL:-http://localhost:8000}"
mkdir -p screenshots
# $usage_targets is mise's non-deprecated multi-value argument contract; the
# Tera template form is deprecated for removal in mise 2027.5.0.
for target in ${usage_targets:-}; do
  case "$target" in
    http*) url="$target" ;;
    *) url="$base$target" ;;
  esac
  if ! curl -s --max-time 10 -o /dev/null "$url"; then
    echo "WARN: $url not reachable — is the server running?" >&2
    continue
  fi
  name=$(printf '%s' "$target" | sed -e 's#https\?://##' -e 's#[^A-Za-z0-9]#_#g' -e 's#^_*##' -e 's#_*$##')
  name=${name:-home}
  aubx agent-browser open "$url" >/dev/null \
    && aubx agent-browser screenshot --full "screenshots/${name}.png" \
    || echo "WARN: capture failed for $url" >&2
done
'''

[tasks.kill]
description = "Kill dev servers (Django on :8000, Vite on :5173, auth0-simulator on :4400)"
run = "lsof -ti :8000 | xargs kill -9 2>/dev/null; lsof -ti :5173 | xargs kill -9 2>/dev/null; lsof -ti :4400 | xargs kill -9 2>/dev/null; echo 'Dev servers killed'"


[tasks.ts-check]
description = "Type-check frontend TypeScript"
run = "aubr -C src/ludamus/client typecheck"

[tasks."ts-check:ios"]
description = "Type-check the iOS regression scripts"
run = "aube exec tsc -p scripts/ios-regressions/tsconfig.json"

[tasks.fallow]
description = "Analyze frontend TypeScript: dead code, duplication, complexity"
run = "aube exec -C src/ludamus/client fallow"

[tasks.lint-client]
description = "Lint frontend TypeScript (oxlint, CI-blocking)"
run = "aubr -C src/ludamus/client lint"


[tasks.npm]
description = "Run npm in the frontend client directory"
run = "npm"
dir = "src/ludamus/client"

[tasks.papercut]
description = "Append a friction note to PAPERCUTS.md (e.g. mise run papercut -- ran shots, server wasn't up, no clear error)"
dir = "{{ config_root }}"
usage = '''
arg "<note>" var=#true help="One or two sentences: what you were doing -> what got in the way"
'''
run = '''
set -eu
[ -n "${usage_note:-}" ] || { echo "usage: mise run papercut -- <note>" >&2; exit 2; }
# usage passes the variadic note as a shell-quoted join, so apostrophes arrive
# as '\'' sequences — shlex.split undoes that. textwrap keeps markdownlint
# MD013 (80 columns) happy with the same hanging indent as hand-written
# entries.
python - <<'EOF'
import datetime
import os
import shlex
import textwrap

note = " ".join(shlex.split(os.environ["usage_note"])).strip()
entry = textwrap.fill(
    f"- {datetime.date.today():%Y-%m-%d}: {note}", width=80, subsequent_indent="  "
)
with open("PAPERCUTS.md", "a", encoding="utf-8") as file:
    file.write(entry + "\n")
EOF
echo "logged to PAPERCUTS.md"
'''
