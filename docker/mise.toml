[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 1

[tools]
python = "3.14"
node = "v25.6.1"
poetry = { version = "2.3.2", pyproject = "/app/pyproject.toml" }
"github:endevco/aube" = "1.22.0"

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }

# Tasks defined inline; host's tasks.toml is not included here.
# Host wraps `dj`/`start` with `aubr varlock` to load .env. In the
# container, compose passes env directly and varlock isn't present.

[tasks.dj]
run = "django-admin"

[tasks.start]
run = "honcho start -e /dev/null -f Procfile.dev"

[tasks.frontend-deps]
run = "aube install --filter ./src/ludamus/client --frozen-lockfile --no-optional"

[tasks.build-frontend]
run = "aubr -C src/ludamus/client build"

# Stamp chunk ids into the built JS and push the matching source maps to
# PostHog so captured exceptions resolve to TypeScript frames. Requires
# POSTHOG_CLI_TOKEN + POSTHOG_CLI_ENV_ID in the environment; the Dockerfile
# guards the call and skips it when the token secret is absent.
[tasks.posthog-sourcemaps]
run = [
    'npx -y @posthog/cli --host "${POSTHOG_CLI_HOST:-https://eu.posthog.com}" sourcemap inject --directory src/ludamus/static/vite',
    'npx -y @posthog/cli --host "${POSTHOG_CLI_HOST:-https://eu.posthog.com}" sourcemap upload --directory src/ludamus/static/vite',
]

# Coolify runs a single web container: migrations/collectstatic happen at
# start instead of one-shot compose services. ponytail: single instance;
# move migrate to a pre-deploy command if replicas ever appear.
[tasks.prod-start]
run = [
    "django-admin migrate --noinput",
    "django-admin createcachetable",
    "django-admin downloadvendor",
    "django-admin collectstatic --noinput --clear",
    "mise run gunicorn",
]

# --keep-alive must stay above the fronting proxy's idle timeout (Coolify's
# Traefik: 180s by default, but it only reuses connections it opened, so the
# race window is what matters, not the full timeout). With gunicorn's 2s
# default, Traefik keeps sending requests down a connection gunicorn has just
# closed and the user gets a 502 with nothing in the app log.
[tasks.gunicorn]
run = """
gunicorn \
    --bind 0.0.0.0:8000 \
    --workers 4 \
    --threads 2 \
    --worker-class gthread \
    --worker-tmp-dir /dev/shm \
    --keep-alive 190 \
    --timeout 60 \
    --graceful-timeout 30 \
    --access-logfile - \
    --access-logformat '%(h)s %(t)s "%(r)s" %(s)s %(b)s %(L)ss "%(a)s"' \
    --error-logfile - \
    --chdir /app/src ludamus.edges.wsgi:application
"""
